name: Post to channel

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: proxy-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Post to channel
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python post.py
      - name: Commit rotation state
        run: |
          git config user.name "mtproxy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add last_used.json
          if [ -f digest_state.json ]; then git add digest_state.json; fi
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: rotation state $(date -u +%FT%TZ)"
            for i in 1 2 3; do
              if git pull --rebase origin main && git push; then break; fi
              sleep 5
            done
          fi
